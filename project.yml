name: ApexGrid
options:
  bundleIdPrefix: com.custom
  deploymentTarget:
    iOS: "17.0"
targets:
  ApexGrid:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - target: ApexGridWidget
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.apexgrid
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: "2.5.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"

  ApexGridWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.apexgrid.widget
        INFOPLIST_FILE: Resources/WidgetInfo.plist
        MARKETING_VERSION: "2.5.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
