name: PodsStats
options:
  bundleIdPrefix: com.custom
  deploymentTarget:
    iOS: "17.0"
targets:
  PodsStats:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - target: PodsStatsWidget
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.podsstats
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/PodsStats.entitlements
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"

  PodsStatsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.podsstats.widget
        INFOPLIST_FILE: Resources/WidgetInfo.plist
        CODE_SIGN_ENTITLEMENTS: Resources/PodsStatsWidget.entitlements
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
